# Generated by tools/fill_and_verify.py. Do not edit the copy in the repository by hand.
# Clash Party (mihomo) YAML override: adds the Sensitive / AI / Honor-of-Kings groups and rules on top
# of an airport subscription. Before use, replace each PASTE_..._HERE with that airport's
# Clash/mihomo subscription link IN YOUR LOCAL COPY ONLY. Never put the links back into the repository.
# A provider that fails to load leaves its sub-group empty, which mihomo treats like a direct connection.

proxy-providers:
  'SinX':
    type: http
    url: 'PASTE_SINX_SUBSCRIPTION_LINK_HERE'
    interval: 86400
    health-check:
      enable: false
  'G94cloud':
    type: http
    url: 'PASTE_G94CLOUD_SUBSCRIPTION_LINK_HERE'
    interval: 86400
    health-check:
      enable: false

+proxy-groups:
  - name: 'Sensitive'
    type: select
    proxies:
      - 'Sensitive-SinX'
      - 'Sensitive-G94cloud'
  - name: 'AI'
    type: select
    proxies:
      - 'AI-SinX'
      - 'AI-G94cloud'
  - name: 'Honor-of-Kings'
    type: select
    proxies:
      - 'Honor-of-Kings-SinX'
      - 'Honor-of-Kings-G94cloud'
  - name: 'Sensitive-SinX'
    type: select
    use:
      - 'SinX'
  - name: 'Sensitive-G94cloud'
    type: select
    use:
      - 'G94cloud'
  - name: 'AI-SinX'
    type: select
    use:
      - 'SinX'
  - name: 'AI-G94cloud'
    type: select
    use:
      - 'G94cloud'
  - name: 'Honor-of-Kings-SinX'
    type: select
    use:
      - 'SinX'
  - name: 'Honor-of-Kings-G94cloud'
    type: select
    use:
      - 'G94cloud'

rule-providers:
  rs-Sensitive:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/bark-jie/youtube-reviewed/main/ruleset/clash/Sensitive.yaml
    interval: 86400
  rs-AI:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/bark-jie/youtube-reviewed/main/ruleset/clash/AI.yaml
    interval: 86400
  rs-HonorOfKings:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/bark-jie/youtube-reviewed/main/ruleset/clash/HonorOfKings.yaml
    interval: 86400

+rules:
  - RULE-SET,rs-Sensitive,Sensitive
  - RULE-SET,rs-AI,AI
  - RULE-SET,rs-HonorOfKings,Honor-of-Kings
  - DOMAIN-WILDCARD,*.sgameglobal.com.acc.*,Honor-of-Kings
